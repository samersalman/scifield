# V1-S12 — Forecasting config (temporal split, emergence label, baselines).
# Flat YAML loaded via _load_forecasting_config("v1") (mirrors _load_novelty_config).

input:
  archetypes_parquet: data/v1/archetypes.parquet
  topics_parquet: data/v1/topics.parquet
  duckdb_path: data/v1/papers.duckdb

output:
  features_parquet: data/v1/forecasting_features.parquet
  metrics_parquet: data/v1/forecasting_baselines.parquet
  # V1-S13 GNN outputs (gitignored artifacts).
  snapshots_dir: data/v1/gnn_snapshots
  sweep_parquet: data/v1/forecasting_sweep.parquet
  checkpoint: models/v1/hgt_best.pt
  study_db: models/v1/hgt_study.db
  # V1-S14 — sealed test-set evaluation artifacts (Gate G4).
  test_metrics_parquet: data/v1/forecasting_test_metrics.parquet
  test_per_unit_parquet: data/v1/forecasting_test_per_unit.parquet
  test_calibration_parquet: data/v1/forecasting_test_calibration.parquet
  test_sensitivity_parquet: data/v1/forecasting_test_sensitivity.parquet
  test_wilcoxon_json: data/v1/forecasting_test_wilcoxon.json

# Split denotes the forecast-ORIGIN year (feature cutoff). [lo, hi] inclusive.
split:
  train: [1998, 2017]
  val: [2018, 2020]
  test: [2021, 2022]      # SEALED — never materialized in S12
  horizon: 3
  trailing_window: 3

# Emergence label = multiplicative share growth (primary). gamma/v_min are the
# human's scientific call — executor reports class balance for Samer to retune.
label:
  gamma: 1.5
  v_min: 30
  mode: multiplicative
  delta: 0.002            # epsilon: growth-ratio denominator guard + additive-jump threshold + MAPE guard

noise:
  denominator: leaf_only  # share denom = leaf papers only (noise excluded num+denom)
  noise_topic_id: -1

# feature_columns: MUST be byte-identical to data.MLP_FEATURES / data.NODE_FEATURES (§4).
features:
  mlp_columns: [count_3yr, share_3yr_mean, share_last, share_growth_3yr, share_momentum, share_accel, share_volatility_3yr, topic_age, share_of_max]
  node_columns: [count_3yr, share_3yr_mean, share_last, share_growth_3yr, share_momentum, share_accel, share_volatility_3yr, topic_age, share_of_max, sem_nov_mean_3yr, cd5_3yr, cd10_3yr, cited_by_pctile_3yr, rct_share_3yr, review_share_3yr, n_journals_3yr]

baselines:
  naive: {}
  arima:
    order: [1, 1, 0]      # (p,d,q); per-topic, falls back to naive on failure
  mlp:
    hidden: 32
    epochs: 50
    lr: 0.01
    batch_size: 256
    seed: 1729
  no_graph:
    hidden: 32
    epochs: 50
    lr: 0.01
    batch_size: 256
    seed: 1729

# V1-S13 — HGT (heterogeneous graph transformer) over per-origin-year snapshots.
# Architecture/metrics/split are pre-registered (OSF DOI 10.17605/OSF.IO/XP94F);
# hardware is NOT constrained, so this runs locally on Mac CPU ($0). The
# n_layers=0 / conv_type ablation is what keeps Gate G4's >5pp test (V1-S14) honest.
gnn:
  conv_type: hgt          # hgt | sage (sage = pure-Python HeteroConv(SAGEConv) fallback)
  hidden: 64
  n_layers: 2
  heads: 2
  dropout: 0.2
  lr: 0.001
  epochs: 200
  patience: 25
  seed: 1729
  device: cpu             # cpu | mps
  pos_weight: auto        # auto = n_neg/n_pos from TRAIN
  sweep:
    n_trials: 40
    search:
      lr: [1.0e-4, 1.0e-2]
      hidden: [32, 64, 128]
      n_layers: [1, 2, 3]
      dropout: [0.0, 0.5]
      heads: [1, 2, 4]

preregistration:
  osf_url: https://doi.org/10.17605/OSF.IO/XP94F
  pr_doc: docs/preregistrations/PR2_forecasting.md
